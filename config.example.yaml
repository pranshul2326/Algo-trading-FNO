# Saidarshan trading engine config. Copy to config.yaml and edit.
# Secrets do NOT live here - they come from .env / environment variables.

server:
  host: "127.0.0.1"        # keep on loopback; this service can place real orders
  port: 8787

# paper  = no broker orders, fills simulated at candle/LTP prices (default, safe)
# live   = real orders are sent to the broker
mode: paper

broker:
  # Who executes orders. Dhan order placement needs a whitelisted static IP
  # (SEBI requirement); read-only endpoints do not.
  name: dhan               # dhan | stoxkart | paper

  # Who supplies candles and quotes. Dhan charges ₹499 + taxes/month for Data APIs;
  # Upstox serves candles free and with no credentials at all, so this is the default
  # pairing: free data, Dhan execution.
  #   upstox    - free, no credentials needed
  #   dhan      - needs the Dhan Data API subscription
  #   synthetic - generated prices, for exploring the UI
  #   (empty)   - the execution broker also supplies data
  data_broker: upstox

engine:
  poll_seconds: 15         # how often watches are re-evaluated
  approval_ttl_seconds: 300  # a pending approval expires after this
  cooldown_seconds: 120    # wait after an exit before re-arming the same watch
  max_trades_per_day: 4    # per watch
  max_open_positions: 3    # across all watches
  square_off_time: "15:15" # IST, force-exit intraday positions (delivery is carried)
  no_new_entry_after: "15:00"  # intraday entries only
  market_open: "09:15"
  market_close: "15:30"
  default_product: INTRADAY    # INTRADAY | DELIVERY (CNC for shares, NRML for F&O)

strategy:
  timeframe_minutes: 5     # 1 3 5 9 15 30 60 120 | 1440 = day, 10080 = week, 43200 = month
  rsi_period: 21
  rsi_signal_entry_period: 21   # EMA(RSI(21), 21) - entry signal line
  rsi_signal_exit_period: 9     # EMA(RSI(21), 9)  - exit signal line
  supertrend_period: 21
  supertrend_factor: 0.618
  price_ema_period: 21     # shown in the options table
  adx_period: 14
  adx_min: 20.0            # options strategy gate; null disables
  require_adx: false       # equity strategy: false (per intraday_swing.md)

  # "state"  -> condition is true whenever RSI > signal (matches "or greater than")
  # "cross"  -> condition only true on the bar where it crosses above (stricter)
  entry_condition_mode: state
  entry_candle_type: normal   # normal | heikin_ashi; fixed Strategy/Trade BUY/SELL entry gate
  exit_condition_mode: state   # only read while exit_rules is null
  # The candles the exit_rules rows read. Leave it out (or null) for each watch's own
  # timeframe_minutes, as before; orders placed from a chart keep the chart's.
  # exit_timeframe_minutes: 15

  # Exit conditions, one row each, as built on the Strategy tab. Rows are joined by
  # AND / OR (AND binds tighter, as in Pine). `on: close` checks the last closed
  # candle, and only candles that closed after the position was opened; `on: live`
  # checks the forming candle at the live price. `candle_type` is normal (default) or
  # heikin_ashi and controls both OHLC values and indicators for that row. Written for
  # a long; a short uses the mirror image. null = the two rows below, built from the
  # settings above.
  #   ind: close | open | high | low | vwap | ema | sma | supertrend | rsi | rsi_ema
  #        | adx | plus_di | minus_di | atr | value
  #   op:  crosses_below | crosses_above | below | above | at_or_below | at_or_above
  exit_rules: null
  # exit_rules:
  #   - left:  {ind: rsi, period: 21}
  #     op:    below
  #     right: {ind: rsi_ema, rsi: 21, period: 9}
  #     on:    close
  #   - join:  OR
  #     left:  {ind: close}
  #     op:    below
  #     right: {ind: supertrend, period: 21, factor: 0.618}
  #     on:    close

risk:
  stop_loss_pct: 3.0       # % of capital deployed on that leg -> 3% adverse price move
  target_pct: null         # e.g. 6.0 for a 2:1 take-profit; null = no TP
  place_stop_at_broker: true   # also send an SL-M order so you are covered if this app dies
  # What closes a position unless a watch, basket or order says otherwise:
  #   both      - stop / target / trailing, and the exit conditions above
  #   sl_target - stop / target / trailing only
  #   strategy  - the exit conditions only: no stop at all
  exit_mode: both
  # Trailing profit: once a trade is trail_profit_trigger_pct in profit, the stop follows
  # the best price at trail_profit_value (% of that price, or points) and never moves
  # back. Both null = off.
  trail_profit_trigger_pct: null   # e.g. 1.0
  trail_profit_value: null         # e.g. 0.5
  trail_profit_unit: pct           # pct | pts

options:
  otm_count: 5             # ATM plus 5 OTM strikes each side
  default_underlying: NIFTY
  expiry: nearest          # nearest | YYYY-MM-DD

# Per-workspace settings, written by each workspace's Setup and Strategy views.
# Ids: stock_intraday, option_buyer, option_seller. A workspace with no entry follows
# the strategy: and risk: sections above as its own deep copy, so a change in one
# workspace never reaches another. A saved part is the section above with the given
# keys changed; leave a part out to keep following it. Mode, brokers, credentials,
# Halt / Resume, the engine caps and the session times apply to all workspaces and
# cannot be set here.
# workspaces:
#   option_buyer:
#     strategy: {timeframe_minutes: 3, require_adx: true}
#     risk: {stop_loss_pct: 20.0, target_pct: 40.0}
#     defaults: {underlying: BANKNIFTY, lots: 1}
#   option_seller:
#     defaults: {underlying: NIFTY, lots: 1, stop_loss_pct: 30.0}

# Live BUY/SELL scanner (Stock Intraday > Scanner, run.py scan). Read-only: it never places orders.
# Each row is one condition on its own timeframe, written like the exit rules above, plus
#   tf: 1m 3m 5m 9m 15m 30m 1h 2h 1D 1W 1M
#   candle_type: normal | heikin_ashi (default: normal)
#   'on': live  = the forming candle, its close at the live price (as TradingView draws it)
#         close = the last closed candle
# Keep 'on' in quotes: YAML reads a bare on: as true/false.
# Rows are joined by AND / OR (AND binds tighter). buy_rules: null = these seven rows.
# sell_rules: null mirrors the BUY rows: above <-> below, RSI levels reflected around 50.
scanner:
  buy_rules:
    - {tf: 1W,  left: {ind: rsi, period: 14}, op: at_or_above, right: {ind: value, value: 50}, 'on': live}
    - {tf: 1D,  join: AND, left: {ind: close}, op: at_or_above, right: {ind: ema, period: 200}, 'on': live}
    - {tf: 1D,  join: AND, left: {ind: close}, op: above, right: {ind: supertrend, period: 21, factor: 0.618}, 'on': live}
    - {tf: 2h,  join: AND, left: {ind: close}, op: above, right: {ind: supertrend, period: 21, factor: 0.618}, 'on': live}
    - {tf: 5m,  join: AND, left: {ind: close}, op: above, right: {ind: supertrend, period: 21, factor: 0.618}, 'on': live}
    - {tf: 15m, join: AND, left: {ind: close}, op: above, right: {ind: vwap}, 'on': live}
    - {tf: 15m, join: AND, left: {ind: rsi, period: 21}, op: at_or_above, right: {ind: rsi_ema, rsi: 21, period: 14}, 'on': live}
  sell_rules: null
  universes: [nifty50]       # nifty50 niftynext50 fno nifty200 nifty500 midcap150 midcap100
                             # smallcap250 smallcap100 mcx (several = their union)
  custom_symbols: []         # e.g. [NSE:RELIANCE, BSE:TCS, MCX:GOLD]
  side: both                 # both | buy | sell
  evaluation: auto           # auto = every condition when the budget allows; lazy = stop at a failure
  auto_rescan_minutes: 0     # 0 = off; 2 5 10 15 30 60: the console's default interval. It starts only
                             # after you press Run, never on page load, and is refused when it would
                             # exceed the budget. run.py scan ignores it.
  max_requests_per_30min: 1500   # the scanner's share of Upstox's 2,000 requests per 30 minutes,
                                 # counted across Saidarshan processes sharing this cache directory
  requests_per_second: 6         # 0.5-8; the engine keeps the rest of Upstox's 10/s
  concurrency: 6
